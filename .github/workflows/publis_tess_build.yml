name: Staging Build

on:
  push:
    branches:
      - staging  # ✅ Only run when pushing to `staging`

  workflow_dispatch: # ✅ Allow manual triggering if needed

jobs:
  staging-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          expo-cache: true
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK for staging
        run: eas build --profile preview --platform android --non-interactive
